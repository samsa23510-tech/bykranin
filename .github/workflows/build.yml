name: Compile Pawn

on:
  push:
    branches: [ main ]

jobs:
  compilepawn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile inside Docker
        uses: addnab/docker-run-action@v3
        with:
          image: sacnr/pawncc:latest
          options: -v ${{ github.workspace }}:/work
          run: |
            cd /work
            /pawnc/bin/pawncc bykranin.pwn -i include/ -o bykranin.amx

      - name: Upload compiled file
        uses: actions/upload-artifact@v4
        with:
          name: compiled-amx
          path: bykranin.amx
