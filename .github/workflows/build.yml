name: Compile Pawn

on:
  push:
    branches: [ main ]

jobs:
  compilepawn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Pawn compiler
        run: |
          wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          tar -xvf pawnc-3.10.10-linux.tar.gz

      - name: Compile Pawn script
        run: |
          ./pawnc-3.10.10/bin/pawncc bykranin.pwn -i include/ -o bykranin.amx

      - name: Upload compiled file
        uses: actions/upload-artifact@v4
        with:
          name: compiled-amx
          path: bykranin.amx
