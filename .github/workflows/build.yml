name: Compile Pawn

on:
  push:
    branches: [ main ]

jobs:
  compilepawn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sampctl
        run: |
          curl https://raw.githubusercontent.com/Southclaws/sampctl/master/install.sh | bash
          echo "$HOME/.samp/bin" >> $GITHUB_PATH

      - name: Compile
        run: sampctl package build

      - name: Upload amx
        uses: actions/upload-artifact@v4
        with:
          name: compiled-amx
          path: bykranin.amx
