name: Compile Pawn

on:
  push:
    branches: [ main ]

jobs:
  compilepawn:
    runs-on: ubuntu-latest
    container:
      image: sacnr/pawncc:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Pawn script
        run: |
          /pawnc/bin/pawncc bykranin.pwn -i include/ -o bykranin.amx

      - name: Upload compiled file
        uses: actions/upload-artifact@v4
        with:
          name: compiled-amx
          path: bykranin.amx
