name: Compile Pawn

on:
  push:
    branches: [ main ]

jobs:
  compilepawn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract and prepare includes
        run: |
          # Если есть zip, распаковываем
          if [ -f include.zip ]; then unzip -o include.zip -d .; fi
          # Создаем чистую папку include и копируем туда ВСЕ найденные .inc файлы
          mkdir -p compiled_includes
          find . -name "*.inc" -exec cp {} compiled_includes/ \;
          ls compiled_includes

      - name: Compile inside Docker
        uses: addnab/docker-run-action@v3
        with:
          image: sacnr/pawncc:latest
          options: -v ${{ github.workspace }}:/work
          run: |
            cd /work
            /pawnc/bin/pawncc bykranin.pwn -i compiled_includes/ -o bykranin.amx

      - name: Upload compiled file
        uses: actions/upload-artifact@v4
        with:
          name: compiled-amx
          path: bykranin.amx
